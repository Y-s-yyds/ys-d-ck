      if (type === 'milestone') {
        return `
          <div class="record-card">
            <div class="record-card__header">
              <div>
                <span class="record-card__tag record-card__tag--milestone">🎯 ${Util.escapeHtml(item.title)}</span>
                <span class="record-card__date" style="margin-left:0.6rem">${date ? Util.formatDate(date) : ''} <span class="record-card__day-tag">${dayTag}</span></span>
              </div>
              <div class="record-card__actions">
                <button class="icon-btn" onclick="App.openEdit('milestone','${item.id}')" title="编辑">✎</button>
                <button class="icon-btn icon-btn--danger" onclick="App.confirmDelete('milestone','${item.id}')" title="删除">🗑</button>
              </div>
            </div>
            ${item.description ? `<div class="record-card__body">${Util.escapeHtml(item.description)}</div>` : ''}
          </div>`;
      }

      if (type === 'taboo') {
        return `
          <div class="record-card">
            <div class="record-card__header">
              <div class="record-card__title">⚠️ ${Util.escapeHtml(item.content)}</div>
              <div class="record-card__actions">
                <button class="icon-btn" onclick="App.openEdit('taboo','${item.id}')" title="编辑">✎</button>
                <button class="icon-btn icon-btn--danger" onclick="App.confirmDelete('taboo','${item.id}')" title="删除">🗑</button>
              </div>
            </div>
            ${item.tags ? `<div class="record-card__body" style="font-size:0.8rem;color:var(--color-muted)">标签：${Util.escapeHtml(item.tags)}</div>` : ''}
          </div>`;
      }

      if (type === 'expense') {
        return `
          <div class="record-card">
            <div class="record-card__header">
              <div>
                ${dateHTML}
                ${item.note ? `<div class="record-card__body" style="margin-top:0.3rem;font-size:0.85rem">${Util.escapeHtml(item.note)}</div>` : ''}
              </div>
              <div style="display:flex;align-items:center;gap:0.8rem">
                <span class="record-card__amount">¥${parseFloat(item.amount).toFixed(2)}</span>
                <div class="record-card__actions">
                  <button class="icon-btn" onclick="App.openEdit('expense','${item.id}')" title="编辑">✎</button>
                  <button class="icon-btn icon-btn--danger" onclick="App.confirmDelete('expense','${item.id}')" title="删除">🗑</button>
                </div>
              </div>
            </div>
          </div>`;
      }

      if (type === 'conflict') {
        return `
          <div class="record-card">
            <div class="record-card__header">
              ${dateHTML}
              <div class="record-card__actions">
                <button class="icon-btn" onclick="App.openEdit('conflict','${item.id}')" title="编辑">✎</button>
                <button class="icon-btn icon-btn--danger" onclick="App.confirmDelete('conflict','${item.id}')" title="删除">🗑</button>
              </div>
            </div>
            ${item.cause ? `<div class="record-card__title">起因：${Util.escapeHtml(item.cause)}</div>` : ''}
            ${item.description ? `<div class="record-card__body">${Util.escapeHtml(item.description)}</div>` : ''}
            ${item.resolution ? `<div class="record-card__body" style="margin-top:0.6rem;color:var(--color-success)">解决：${Util.escapeHtml(item.resolution)}</div>` : ''}
            ${item.lessons ? `<div class="record-card__body" style="margin-top:0.4rem;color:var(--color-pink);font-size:0.82rem">💡 ${Util.escapeHtml(item.lessons)}</div>` : ''}
          </div>`;
      }

      if (type === 'memorial') {
        const personLabel = item.person === 'male' ? '👨 男生' : '👩 女生';
        const personColor = item.person === 'male' ? '#6b8cce' : 'var(--color-pink)';
        const daysAgo = item.date ? Util.daysSince(item.date) : null;
        const daysText = daysAgo !== null
          ? (daysAgo === 0 ? '今天' : daysAgo > 0 ? `已过 ${daysAgo} 天` : `还有 ${Math.abs(daysAgo)} 天`)
          : '';
        return `
          <div class="record-card">
            <div class="record-card__header">
              <div>
                ${dateHTML}
                <span style="display:inline-block;margin-left:0.5rem;padding:0.15rem 0.6rem;border-radius:999px;font-size:0.75rem;font-weight:600;color:#fff;background:${personColor}">${personLabel}</span>
                ${daysText ? `<span style="margin-left:0.5rem;font-size:0.78rem;color:var(--color-muted)">${daysText}</span>` : ''}
              </div>
              <div class="record-card__actions">
                <button class="icon-btn" onclick="App.openEdit('memorial','${item.id}')" title="编辑">✎</button>
                <button class="icon-btn icon-btn--danger" onclick="App.confirmDelete('memorial','${item.id}')" title="删除">🗑</button>
              </div>
            </div>
            ${item.title ? `<div class="record-card__title">${Util.escapeHtml(item.title)}</div>` : ''}
            ${item.description ? `<div class="record-card__body">${Util.escapeHtml(item.description)}</div>` : ''}
          </div>`;
      }

      return '';
    },

    // ---- 喜好渲染（分组：当前 / 已变更）----
    _renderPreferences(list, container) {
      const searchTerm = document.getElementById('search-preference')?.value?.toLowerCase() || '';
      const filtered = searchTerm
        ? list.filter(i => JSON.stringify(i).toLowerCase().includes(searchTerm))
        : list;

      const active = filtered.filter(i => i.status !== 'changed');
      const changed = filtered.filter(i => i.status === 'changed');

      // 按分类分组
      const groupBy = (items) => {
        const groups = {};
        items.forEach(i => {
          const cat = i.category || '其他';
          if (!groups[cat]) groups[cat] = [];
          groups[cat].push(i);
        });
        return groups;
      };

      let html = '';

      if (active.length === 0 && changed.length === 0) {
        container.innerHTML = this._emptyHTML('preference');
        return;
      }

      if (active.length > 0) {
        html += '<div class="group-title">当前喜好</div><div class="record-list">';
        const groups = groupBy(active);
        Object.entries(groups).forEach(([cat, items]) => {
          html += `<div class="record-card"><div class="record-card__header"><div class="record-card__title">${Util.escapeHtml(cat)}</div></div>`;
          items.forEach(i => {
            html += `<div style="display:flex;align-items:center;justify-content:space-between;padding:0.3rem 0;border-bottom:1px solid rgba(255,107,157,0.06)">
              <span style="font-size:0.9rem;color:var(--color-text)">${Util.escapeHtml(i.value)}</span>
              <div style="display:flex;gap:0.4rem;align-items:center">
                ${i.note ? `<span style="font-size:0.75rem;color:var(--color-muted)">${Util.escapeHtml(i.note)}</span>` : ''}
                <button class="icon-btn" onclick="App.markPreferenceChanged('${i.id}')" title="标记为已变更" style="font-size:0.75rem">↻ 变更</button>
                <button class="icon-btn icon-btn--danger" onclick="App.confirmDelete('preference','${i.id}')" title="删除">🗑</button>
              </div>
            </div>`;
          });
          html += '</div>';
        });
        html += '</div>';
      }

      if (changed.length > 0) {
        html += '<div class="group-title">已变更（历史记录）</div><div class="record-list">';
        changed.forEach(i => {
          html += `<div class="record-card">
            <div class="record-card__header">
              <div>
                <span class="record-card__tag record-card__tag--changed">已变更</span>
                <span style="margin-left:0.6rem;font-size:0.85rem;color:var(--color-muted)">${Util.escapeHtml(i.category || '其他')}</span>
              </div>
              <div class="record-card__actions">
                <button class="icon-btn icon-btn--danger" onclick="App.confirmDelete('preference','${i.id}')" title="删除">🗑</button>
              </div>
            </div>
            <div class="record-card__body">${Util.escapeHtml(i.value)}</div>
            <div class="record-card__changed-note">变更于 ${Util.formatDate(i.changedDate || i.createdAt)}</div>
          </div>`;
        });
        html += '</div>';
      }

      container.innerHTML = html;
    },

    markPreferenceChanged(id) {
      const newVal = prompt('输入新的喜好值（留空则仅标记为已变更）：');
      if (newVal === null) return;
      DB.update('preference', id, { status: 'changed', changedDate: Util.today() });
      if (newVal.trim()) {
        const old = DB.getAll('preference').find(i => i.id === id);
        DB.add('preference', {
          category: old?.category || '其他',
          value: newVal.trim(),
          status: 'active',
          note: ''
        });
        showToast('已更新喜好记录');
      } else {
        showToast('已标记为变更', 'warning');
      }
      this.renderList('preference');
    },

    // ---- 愿望渲染（待完成 / 已完成）----
    _renderWishes(list, container) {
      const pending = list.filter(i => !i.completed);
      const done = list.filter(i => i.completed);

      if (list.length === 0) {
        container.innerHTML = this._emptyHTML('wish');
        return;
      }

      let html = '';

      if (pending.length > 0) {
        html += '<div class="group-title">待完成</div><div class="record-list">';
        pending.forEach(i => {
          const dayTag = i.targetDate ? ` · 目标 ${Util.formatDateShort(i.targetDate)}` : '';
          html += `<div class="record-card">
            <div class="record-card__header">
              <div class="record-card__title">✨ ${Util.escapeHtml(i.title)}</div>
              <div class="record-card__actions">
                <button class="icon-btn" onclick="App.completeWish('${i.id}')" title="标记完成" style="color:var(--color-success)">✓</button>
                <button class="icon-btn" onclick="App.openEdit('wish','${i.id}')" title="编辑">✎</button>
                <button class="icon-btn icon-btn--danger" onclick="App.confirmDelete('wish','${i.id}')" title="删除">🗑</button>
              </div>
            </div>
            ${i.description ? `<div class="record-card__body">${Util.escapeHtml(i.description)}</div>` : ''}
            ${dayTag ? `<div style="font-size:0.75rem;color:var(--color-muted);margin-top:0.3rem">${dayTag}</div>` : ''}
          </div>`;
        });
        html += '</div>';
      }

      if (done.length > 0) {
        html += '<div class="group-title">已完成</div><div class="record-list">';
        done.forEach(i => {
          html += `<div class="record-card" style="opacity:0.6">
            <div class="record-card__header">
              <div>
                <span class="record-card__tag record-card__tag--completed">✓ 已完成</span>
                <span style="margin-left:0.6rem;font-size:0.9rem;text-decoration:line-through">${Util.escapeHtml(i.title)}</span>
              </div>
              <div class="record-card__actions">
                <button class="icon-btn icon-btn--danger" onclick="App.confirmDelete('wish','${i.id}')" title="删除">🗑</button>
              </div>
            </div>
          </div>`;
        });
        html += '</div>';
      }

      container.innerHTML = html;
    },

    completeWish(id) {
      DB.update('wish', id, { completed: true, completedAt: Util.today() });
      showToast('已完成！🎉');
      this.renderList('wish');
    },

    // ---- 节日渲染（按倒计时排序）----
    _renderHolidays(customList, container) {
      const settings = DB.getSettings();
      const preset = this._getPresetHolidays(settings || {});
      const all = [...preset, ...customList];

      if (all.length === 0) {
        container.innerHTML = this._emptyHTML('holiday');
        return;
      }

      const withDays = all.map(h => {
        const next = this._getNextHolidayDate(h);
        const days = next ? Util.daysUntil(next) : Infinity;
        return { ...h, nextDate: next, days };
      }).sort((a, b) => a.days - b.days);

      let html = '<div class="record-list">';
      withDays.forEach(h => {
        const isCustom = !h.preset;
        const urgent = h.days <= 7;
        const dateStr = h.nextDate ? Util.formatDateShort(h.nextDate) : '日期待定';
        const lunarTag = h.lunar ? ' <span style="font-size:0.65rem;opacity:0.6">农历</span>' : '';
        html += `<div class="record-card" ${urgent ? 'style="border-color:rgba(255,107,157,0.35);box-shadow:0 4px 20px rgba(255,107,157,0.1)"' : ''}>
          <div class="record-card__header">
            <div style="display:flex;align-items:center;gap:0.6rem">
              <span style="font-size:1.1rem">${urgent ? '🔔' : '🎉'}</span>
              <div>
                <div class="record-card__title">${Util.escapeHtml(h.name)}${lunarTag}</div>
                <div style="font-size:0.72rem;color:var(--color-muted)">${dateStr}</div>
              </div>
            </div>
            <div style="display:flex;align-items:center;gap:0.8rem">
              <span class="record-card__amount">${h.days}</span>
              <span style="font-size:0.75rem;color:var(--color-muted)">天后</span>
              ${isCustom ? `<div class="record-card__actions"><button class="icon-btn icon-btn--danger" onclick="App.confirmDelete('holiday','${h.id}')" title="删除">🗑</button></div>` : ''}
            </div>
          </div>
          ${h.giftSuggestion ? `<div class="record-card__body" style="font-size:0.82rem;color:var(--color-pink)">🎁 ${Util.escapeHtml(h.giftSuggestion)}</div>` : ''}
        </div>`;
      });
      html += '</div>';
      container.innerHTML = html;
    },

    // ---- 添加/编辑弹窗 ----
    openAdd(type) {
      this.editingType = type;
      this.editingId = null;
      this._renderForm(type, null);
      document.getElementById('modalTitle').textContent = this._formTitle(type, false);
      document.getElementById('modalOverlay').classList.add('is-open');
    },

    openEdit(type, id) {
      const item = DB.getAll(type).find(i => i.id === id);
      if (!item) return;
      this.editingType = type;
      this.editingId = id;
      this._renderForm(type, item);
      document.getElementById('modalTitle').textContent = this._formTitle(type, true);
      document.getElementById('modalOverlay').classList.add('is-open');
    },

    _formTitle(type, isEdit) {
      const titles = {
        daily: '日常记录', milestone: '里程碑', preference: '喜好',
        taboo: '忌讳', expense: '消费记录', wish: '愿望',
        holiday: '节日', conflict: '冲突复盘', memorial: '纪念记录'
      };
      return (isEdit ? '编辑' : '添加') + titles[type];
    },

    _renderForm(type, item) {
      const fields = document.getElementById('modalFields');
      const today = Util.today();
      const val = (key) => item ? (item[key] || '') : '';
      const defaultDate = val('date') || today;

      if (type === 'daily') {
        fields.innerHTML = `
          <div class="form-group">
            <label class="form-label">日期 <span class="req">*</span></label>
            <input class="form-input" type="date" id="f_date" value="${defaultDate}">
          </div>
          <div class="form-group">
            <label class="form-label">内容 <span class="req">*</span></label>
            <textarea class="form-textarea" id="f_content" placeholder="今天发生了什么..." required>${val('content')}</textarea>
          </div>`;
      }
      else if (type === 'milestone') {
        fields.innerHTML = `
          <div class="form-group">
            <label class="form-label">日期 <span class="req">*</span></label>
            <input class="form-input" type="date" id="f_date" value="${defaultDate}">
          </div>
          <div class="form-group">
            <label class="form-label">里程碑 <span class="req">*</span></label>
            <select class="form-select" id="f_title" onchange="App._checkCustomMilestone(this)">
              ${MILESTONE_PRESETS.map(p => `<option value="${p}" ${val('title')===p?'selected':''}>${p}</option>`).join('')}
            </select>
          </div>
          <div class="form-group" id="customTitleGroup" style="display:none">
            <label class="form-label">自定义名称</label>
            <input class="form-input" type="text" id="f_customTitle" placeholder="输入里程碑名称">
          </div>
          <div class="form-group">
            <label class="form-label">描述</label>
            <textarea class="form-textarea" id="f_description" placeholder="记录这一刻的感受...">${val('description')}</textarea>
          </div>`;
        if (val('title') && !MILESTONE_PRESETS.includes(val('title'))) {
          this._checkCustomMilestone(document.getElementById('f_title'));
          document.getElementById('f_customTitle').value = val('title');
        }
      }
      else if (type === 'preference') {
        fields.innerHTML = `
          <div class="form-group">
            <label class="form-label">分类 <span class="req">*</span></label>
            <select class="form-select" id="f_category">
              ${PREF_CATEGORIES.map(c => `<option value="${c}" ${val('category')===c?'selected':''}>${c}</option>`).join('')}
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">喜好内容 <span class="req">*</span></label>
            <input class="form-input" type="text" id="f_value" placeholder="如：草莓蛋糕" value="${val('value')}" required>
          </div>
          <div class="form-group">
            <label class="form-label">备注（可选）</label>
            <input class="form-input" type="text" id="f_note" placeholder="如：特别喜欢吃" value="${val('note')}">
          </div>`;
      }
      else if (type === 'taboo') {
        fields.innerHTML = `
          <div class="form-group">
            <label class="form-label">忌讳内容 <span class="req">*</span></label>
            <textarea class="form-textarea" id="f_content" placeholder="如：不吃香菜" required>${val('content')}</textarea>
          </div>
          <div class="form-group">
            <label class="form-label">标签/关键词（可选，逗号分隔）</label>
            <input class="form-input" type="text" id="f_tags" placeholder="如：食物, 饮食" value="${val('tags')}">
          </div>`;
      }
      else if (type === 'expense') {
        fields.innerHTML = `
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">金额 <span class="req">*</span></label>
              <input class="form-input" type="number" id="f_amount" step="0.01" placeholder="0.00" value="${val('amount')}" required>
            </div>
            <div class="form-group">
              <label class="form-label">日期 <span class="req">*</span></label>
              <input class="form-input" type="date" id="f_date" value="${defaultDate}">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">备注（可选）</label>
            <input class="form-input" type="text" id="f_note" placeholder="如：晚餐" value="${val('note')}">
          </div>`;
      }
      else if (type === 'wish') {
        fields.innerHTML = `
          <div class="form-group">
            <label class="form-label">愿望/计划 <span class="req">*</span></label>
            <input class="form-input" type="text" id="f_title" placeholder="如：一起去看极光" value="${val('title')}" required>
          </div>
          <div class="form-group">
            <label class="form-label">描述（可选）</label>
            <textarea class="form-textarea" id="f_description" placeholder="详细描述...">${val('description')}</textarea>
          </div>
          <div class="form-group">
            <label class="form-label">目标日期（可选）</label>
            <input class="form-input" type="date" id="f_targetDate" value="${val('targetDate')}">
          </div>`;
      }
      else if (type === 'holiday') {
        fields.innerHTML = `
          <div class="form-group">
            <label class="form-label">节日名称 <span class="req">*</span></label>
            <input class="form-input" type="text" id="f_name" placeholder="如：相识纪念日" value="${val('name')}" required>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">月份 <span class="req">*</span></label>
              <select class="form-select" id="f_month">
                ${Array.from({length:12},(_,i)=>`<option value="${i+1}" ${val('month')==i+1?'selected':''}>${i+1}月</option>`).join('')}
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">日期 <span class="req">*</span></label>
              <select class="form-select" id="f_day">
                ${Array.from({length:31},(_,i)=>`<option value="${i+1}" ${val('day')==i+1?'selected':''}>${i+1}日</option>`).join('')}
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">礼物建议（可选）</label>
            <input class="form-input" type="text" id="f_giftSuggestion" placeholder="如：口红/手表" value="${val('giftSuggestion')}">
          </div>`;
      }
      else if (type === 'conflict') {
        fields.innerHTML = `
          <div class="form-group">
            <label class="form-label">日期 <span class="req">*</span></label>
            <input class="form-input" type="date" id="f_date" value="${defaultDate}">
          </div>
          <div class="form-group">
            <label class="form-label">起因</label>
            <input class="form-input" type="text" id="f_cause" placeholder="因为什么..." value="${val('cause')}">
          </div>
          <div class="form-group">
            <label class="form-label">经过描述</label>
            <textarea class="form-textarea" id="f_description" placeholder="发生了什么...">${val('description')}</textarea>
          </div>
          <div class="form-group">
            <label class="form-label">解决方式</label>
            <textarea class="form-textarea" id="f_resolution" placeholder="怎么解决的...">${val('resolution')}</textarea>
          </div>
          <div class="form-group">
            <label class="form-label">经验教训</label>
            <textarea class="form-textarea" id="f_lessons" placeholder="下次可以注意什么...">${val('lessons')}</textarea>
          </div>`;
      }
      else if (type === 'memorial') {
        fields.innerHTML = `
          <div class="form-group">
            <label class="form-label">记录对象 <span class="req">*</span></label>
            <div style="display:flex;gap:0.8rem">
              <label style="display:flex;align-items:center;gap:0.4rem;cursor:pointer;font-size:0.95rem">
                <input type="radio" name="f_person" value="female" ${val('person')!=='male'?'checked':''} style="accent-color:var(--color-pink)">
                👩 女生
              </label>
              <label style="display:flex;align-items:center;gap:0.4rem;cursor:pointer;font-size:0.95rem">
                <input type="radio" name="f_person" value="male" ${val('person')==='male'?'checked':''} style="accent-color:#6b8cce">
                👨 男生
              </label>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">日期 <span class="req">*</span></label>
            <input class="form-input" type="date" id="f_date" value="${defaultDate}">
          </div>
          <div class="form-group">
            <label class="form-label">纪念事件 <span class="req">*</span></label>
            <input class="form-input" type="text" id="f_title" placeholder="如：第一次收到她的手写信" value="${val('title')}">
          </div>
          <div class="form-group">
            <label class="form-label">详细描述</label>
            <textarea class="form-textarea" id="f_description" placeholder="记录这一刻的感受和细节...">${val('description')}</textarea>
          </div>`;
      }
    },

    _checkCustomMilestone(select) {
      const group = document.getElementById('customTitleGroup');
      if (select.value === '其他（自定义）') {
        group.style.display = 'block';
      } else {
        group.style.display = 'none';
      }
    },

    closeModal() {
      document.getElementById('modalOverlay').classList.remove('is-open');
      this.editingType = null;
      this.editingId = null;
    },

    // ---- 保存记录 ----
    saveRecord() {
      const type = this.editingType;
      if (!type) return;

      const get = (id) => document.getElementById(id)?.value?.trim() || '';
      let data = {};

      if (type === 'daily') {
        const content = get('f_content');
        if (!content) { showToast('请输入内容', 'warning'); return; }
        data = { date: get('f_date') || Util.today(), content };
        this._checkTaboos(content);
      }
      else if (type === 'milestone') {
        let title = get('f_title');
        if (title === '其他（自定义）') title = get('f_customTitle') || '未命名';
        data = { date: get('f_date') || Util.today(), title, description: get('f_description') };
      }
      else if (type === 'preference') {
        const value = get('f_value');
        if (!value) { showToast('请输入喜好内容', 'warning'); return; }
        data = { category: get('f_category'), value, note: get('f_note'), status: 'active' };
      }
      else if (type === 'taboo') {
        const content = get('f_content');
        if (!content) { showToast('请输入忌讳内容', 'warning'); return; }
        data = { content, tags: get('f_tags') };
      }
      else if (type === 'expense') {
        const amount = get('f_amount');
        if (!amount) { showToast('请输入金额', 'warning'); return; }
        data = { amount: parseFloat(amount), date: get('f_date') || Util.today(), note: get('f_note') };
      }
      else if (type === 'wish') {
        const title = get('f_title');
        if (!title) { showToast('请输入愿望', 'warning'); return; }
        data = { title, description: get('f_description'), targetDate: get('f_targetDate'), completed: false };
      }
      else if (type === 'holiday') {
        const name = get('f_name');
        if (!name) { showToast('请输入节日名称', 'warning'); return; }
        data = { name, month: parseInt(get('f_month')), day: parseInt(get('f_day')), giftSuggestion: get('f_giftSuggestion') };
      }
      else if (type === 'conflict') {
        data = {
          date: get('f_date') || Util.today(),
          cause: get('f_cause'),
          description: get('f_description'),
          resolution: get('f_resolution'),
          lessons: get('f_lessons')
        };
      }
      else if (type === 'memorial') {
        const title = get('f_title');
        if (!title) { showToast('请输入纪念事件', 'warning'); return; }
        const personEl = document.querySelector('input[name="f_person"]:checked');
        data = {
          person: personEl ? personEl.value : 'female',
          date: get('f_date') || Util.today(),
          title,
          description: get('f_description')
        };
      }

      if (this.editingId) {
        DB.update(type, this.editingId, data);
        showToast('已更新');
      } else {
        DB.add(type, data);
        showToast('已保存');
      }

      this.closeModal();
      this.renderAll();
    },

    // ---- 忌讳关键词检查（被动提醒）----
    _checkTaboos(text) {
      const taboos = DB.getAll('taboo');
      if (taboos.length === 0) return;
      const lower = text.toLowerCase();
      const matched = taboos.filter(t => {
        const content = (t.content || '').toLowerCase();
        const tags = (t.tags || '').toLowerCase();
        return content && (lower.includes(content) || tags.split(/[,，]/).some(tag => tag.trim() && lower.includes(tag.trim())));
      });
      if (matched.length > 0) {
        setTimeout(() => {
          showToast(`⚠️ 注意：这条记录可能涉及忌讳：${matched.map(m => m.content).join('、')}`, 'warning');
        }, 800);
      }
    },

    // ---- 删除确认 ----
    confirmDelete(type, id) {
      if (!confirm('确定删除这条记录？')) return;
      DB.delete(type, id);
      showToast('已删除');
      this.renderAll();
    },

    // ---- 设置 ----
    openSettings() {
      const s = DB.getSettings() || {};
      document.getElementById('setStartDate').value = s.startDate || '';
      document.getElementById('setMyName').value = s.myName || '';
      document.getElementById('setMyBirthday').value = s.myBirthday || '';
      document.getElementById('setNickname').value = s.nickname || '';
      document.getElementById('setBirthday').value = s.birthday || '';
      const statusEl = document.getElementById('syncStatus');
      if (statusEl) {
        statusEl.textContent = '✓ 云端同步已开启，自动同步中';
      }
      document.getElementById('settingsOverlay').classList.add('is-open');
    },
    closeSettings() {
      document.getElementById('settingsOverlay').classList.remove('is-open');
    },
    saveSettings() {
      const startDate = document.getElementById('setStartDate').value;
      const myName = document.getElementById('setMyName').value.trim();
      const myBirthday = document.getElementById('setMyBirthday').value;
      const nickname = document.getElementById('setNickname').value.trim();
      const birthday = document.getElementById('setBirthday').value;
      if (!startDate) { showToast('请设置恋爱开始日期', 'warning'); return; }

      DB.setSettings({ startDate, myName, myBirthday, nickname, birthday });
      this.closeSettings();
      this.renderAll();
      showToast('设置已保存，正在同步到云端…');
    },

    manualSync() {
      showToast('正在同步…');
      CloudSync.pull(true).then(updated => {
        if (updated) this.renderAll();
        else CloudSync.push();
      });
    },

    // ---- 数据导出/导入 ----
    exportData() {
      const data = { settings: DB.getSettings() };
      ['daily','milestone','preference','taboo','expense','wish','holiday','conflict','memorial'].forEach(k => {
        data[k] = DB.getAll(k);
      });
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `love-notes-backup-${Util.today()}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('备份已导出');
    },
    importData() {
      const input = document.getElementById('fileInput');
      input.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const data = JSON.parse(ev.target.result);
            if (data.settings) DB.setSettings(data.settings);
            ['daily','milestone','preference','taboo','expense','wish','holiday','conflict','memorial'].forEach(k => {
              if (data[k]) DB.save(k, data[k]);
            });
            this.closeSettings();
            this.renderAll();
            showToast('备份已导入');
          } catch(err) {
            showToast('文件格式错误', 'warning');
          }
        };
        reader.readAsText(file);
      };
      input.click();
    },
    clearData() {
      if (!confirm('确定清空所有数据？此操作不可恢复！')) return;
      if (!confirm('再次确认：真的要清空全部恋爱笔记数据吗？')) return;
      ['settings','daily','milestone','preference','taboo','expense','wish','holiday','conflict','memorial'].forEach(k => {
        localStorage.removeItem(DB.prefix + k);
      });
      localStorage.removeItem('lovenotes_lastTs');
      CloudSync.push(); // 同步空数据到云端
      this.closeSettings();
      this.renderAll();
      showToast('数据已清空', 'warning');
      setTimeout(() => this.openSettings(), 500);
    }
  };

  // 启动
  document.addEventListener('DOMContentLoaded', () => App.init());
  </script>

</body>
</html>
